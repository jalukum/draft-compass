name: Daily stats + deploy

on:
  schedule:
    - cron: '7 10 * * *'   # ~10:00 UTC daily
  workflow_dispatch:
    inputs:
      collect:
        description: 'Run the ladder sampler before deploying'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-and-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.collect)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sample Ranked battle logs
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: node scripts/collect-stats.mjs
      - name: Validate builds against the live official catalog
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: node scripts/validate-builds.mjs --live --check-profiles
      - name: Commit snapshot
        run: |
          git config user.name "draft-compass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Stats snapshot $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

  build:
    needs: collect
    if: always() && (needs.collect.result == 'success' || needs.collect.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate builds against the live official catalog
        env:
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: node scripts/validate-builds.mjs --live --check-profiles
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
